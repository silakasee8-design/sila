<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0e">
  <title>Sign in — SILA AI</title>
  <style>
    :root{--bg:#0b0d0e;--panel:#151819;--panel2:#202526;--text:#f5f0e8;--muted:#a8adae;--accent:#ff6b3d;--border:#2c3233;--danger:#ff8e8e;--ok:#78d6a3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#302016 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.logo{font-weight:900;letter-spacing:.12em}.logo span{color:var(--accent)}a{color:var(--text)}.back{border:1px solid var(--border);border-radius:10px;padding:9px 13px;text-decoration:none}.layout{min-height:calc(100vh - 90px);display:grid;place-items:center;padding:30px 0 70px}.panel{width:min(440px,100%);background:linear-gradient(145deg,var(--panel),#101314);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 20px 60px #0006}.eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.16em}.panel h1{font-size:2.3rem;letter-spacing:-.05em;margin:12px 0 8px}.muted{color:var(--muted);line-height:1.55}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0c0f10;border-radius:12px;padding:5px;margin:24px 0}.tabs button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:11px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--panel2);color:var(--text)}label{display:block;font-size:.85rem;font-weight:700;margin:15px 0 7px}input{width:100%;background:#0c1011;border:1px solid var(--border);border-radius:10px;padding:13px;color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--accent)}.submit{width:100%;border:0;border-radius:10px;background:var(--accent);color:#170b07;font-weight:800;padding:14px;margin-top:22px;cursor:pointer}.message{min-height:22px;margin-top:14px;color:var(--muted);font-size:.9rem}.message.error{color:var(--danger)}.message.ok{color:var(--ok)}.terms{font-size:.76rem;color:var(--muted);margin-top:20px}
  </style>
</head>
<body>
  <header class="wrap top"><div class="logo">SILA <span>AI</span></div><a class="back" href="/">Back to SILA</a></header>
  <main class="wrap layout"><section class="panel"><div class="eyebrow">YOUR PRIVATE AI WORKSPACE</div><h1 id="title">Welcome back.</h1><p id="subtitle" class="muted">Sign in to continue your conversations and keep your chat history synced.</p><div class="tabs"><button id="loginTab" class="active" type="button">Sign in</button><button id="registerTab" type="button">Create account</button></div><form id="authForm"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"><button class="submit" id="submit" type="submit">Sign in</button></form><div id="message" class="message" role="status"></div><p class="terms">Your password is securely hashed. Never share your API keys or password.</p></section></main>
  <script>
    const form=document.getElementById('authForm'),email=document.getElementById('email'),password=document.getElementById('password'),message=document.getElementById('message'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),submit=document.getElementById('submit'),loginTab=document.getElementById('loginTab'),registerTab=document.getElementById('registerTab');let mode='login';
    function setMode(next){mode=next;const register=mode==='register';loginTab.classList.toggle('active',!register);registerTab.classList.toggle('active',register);title.textContent=register?'Create your account.':'Welcome back.';subtitle.textContent=register?'Create an account to save your conversations and use SILA AI across sessions.':'Sign in to continue your conversations and keep your chat history synced.';submit.textContent=register?'Create account':'Sign in';password.autocomplete=register?'new-password':'current-password';message.textContent='';message.className='message'}
    async function submitAuth(event){event.preventDefault();message.textContent=mode==='register'?'Creating your account…':'Signing you in…';message.className='message';try{const response=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});let data={};try{data=await response.json()}catch(error){}if(!response.ok)throw new Error(data.error||'Authentication failed.');message.textContent='Success. Opening SILA…';message.className='message ok';window.location.href='/'}catch(error){message.textContent=error.message;message.className='message error'}}
    loginTab.addEventListener('click',()=>setMode('login'));registerTab.addEventListener('click',()=>setMode('register'));form.addEventListener('submit',submitAuth);
    fetch('/api/auth/me').then(response=>{if(response.ok)window.location.href='/'}).catch(()=>{});
  </script>
</body>
</html>
